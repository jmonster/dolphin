# Called automatically for affected inputs; never a duplicate PR trigger.
name: Switch2Kit macOS qualification
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: switch2kit-macos-${{ github.ref }}
  cancel-in-progress: true
jobs:
  macos:
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: macos-15
            arch: arm64
          - os: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && 60 || 10 }}
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1
      # Do not upgrade unrelated installed Qt modules after installing qtbase.
      # Required components and the complete relocated application are validated below.
      HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: 1
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      # One cache archive per job, not network requests for every object.
      SCCACHE_DIR: ${{ github.workspace }}/.ci-cache/sccache
      SCCACHE_CACHE_SIZE: 2G
      NINJA_STATUS: '[%f/%t %r running, %e sec] '
      # Configure probes and standalone sanitizer/SDK tests must compile directly.
      S2K_CI_COMPILER_CACHE: sccache
    steps:
      - name: Restore Intel runner CPU availability
        if: matrix.arch == 'x86_64'
        run: |
          set -euo pipefail
          # The retained runner profile showed PerfPowerServices using a core.
          # Use the runner-images workaround, scoped to this disposable Intel VM.
          # https://github.com/actions/runner-images/issues/13358
          ps -axo pid,pcpu,comm | sort -rn -k2 | sed -n '1,15p'
          sudo defaults -currentHost write /Library/Preferences/com.apple.powerlogd SMCMonitorCadence 0
          if pgrep -x PerfPowerServices >/dev/null; then
            sudo killall PerfPowerServices
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: false
          persist-credentials: false
      - name: Fetch and verify native gitlinks in parallel
        run: python3 Tools/checkout_native.py
      - name: Restore compiler objects (never test results or applications)
        id: compiler-objects
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ env.SCCACHE_DIR }}
          key: s2k-objects-v4-${{ matrix.os }}-${{ matrix.arch }}-xcode26.3-${{ github.event_name == 'workflow_dispatch' && 'release' || 'smoke' }}-${{ github.sha }}-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            s2k-objects-v4-${{ matrix.os }}-${{ matrix.arch }}-xcode26.3-${{ github.event_name == 'workflow_dispatch' && 'release' || 'smoke' }}-${{ github.sha }}-
            s2k-objects-v4-${{ matrix.os }}-${{ matrix.arch }}-xcode26.3-${{ github.event_name == 'workflow_dispatch' && 'release' || 'smoke' }}-
      - name: Cache native compiler results (tests still run)
        id: compiler-cache
        uses: Mozilla-Actions/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad
        with:
          version: v0.10.0
      - name: Install build dependencies
        run: |
          set -euo pipefail
          installed="$(brew list --formula --versions | awk '{print $1}')"
          missing=()
          for formula in cmake ninja nasm automake libtool qtbase qtsvg; do
            grep -Fxq "$formula" <<< "$installed" || missing+=("$formula")
          done
          if [ "${#missing[@]}" -ne 0 ]; then
            brew install "${missing[@]}"
          fi
          # Split Qt formulae share Homebrew's linked installation prefix.
          # A qtbase keg is not a complete Qt prefix: Svg lives in qtsvg.
          qt_prefix="$(brew --prefix)"
          echo "S2K_QT_PREFIX=$qt_prefix" >> "$GITHUB_ENV"
          # Resolve the selected Xcode compiler once, rather than invoking the
          # /usr/bin toolchain selector for every probe and translation unit.
          cc="$(xcrun --find clang)"
          cxx="$(xcrun --find clang++)"
          test -x "$cc" && test -x "$cxx"
          # Direct Xcode compiler paths do not inherit xcrun's SDK selection.
          # Standalone sanitizer tests need the same headers and libraries too.
          sdk="$(xcrun --sdk macosx --show-sdk-path)"
          test -d "$sdk"
          printf 'CC=%s\nCXX=%s\nOBJC=%s\nOBJCXX=%s\nSDKROOT=%s\n' \
            "$cc" "$cxx" "$cc" "$cxx" "$sdk" >> "$GITHUB_ENV"
          printf '%s\n' '#include <atomic>' \
            'int main() { std::atomic<int> value{42}; return value.load() == 42 ? 0 : 1; }' | \
            SDKROOT="$sdk" "$cxx" -std=c++23 -x c++ - -o "$RUNNER_TEMP/s2k-toolchain-probe"
          "$RUNNER_TEMP/s2k-toolchain-probe"
          for component in Qt6 Qt6Svg; do
            test -f "$qt_prefix/lib/cmake/$component/${component}Config.cmake" || {
              echo "::error::Missing linked Qt package: $component in $qt_prefix" >&2
              exit 1
            }
          done
      - name: Check source pin and integration
        run: |
          test "$(git -C Externals/Switch2Kit rev-parse HEAD)" = "$(git ls-tree HEAD Externals/Switch2Kit | awk '{print $3}')"
          python3 Tools/test_switch2kit.py
          python3 Tools/test_switch2kit_autoconnect.py
          python3 Tools/test_switch2kit_host.py --sanitize
          python3 Tools/test_switch2kit_mapping.py --sanitize
      - name: Build the complete application
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          test "$(uname -m)" = "$ARCH"
          ps -axo pid,pcpu,comm | sort -rn -k2 | sed -n '1,15p'
          cmake --profiling-format=google-trace \
            --profiling-output="$PWD/switch2kit-configure-profile.json" \
            -S . -B build-switch2kit -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 \
            "-DCMAKE_PROJECT_dolphin-emu_INCLUDE=$PWD/Tools/ci-native.cmake" \
            -DCMAKE_OSX_ARCHITECTURES="$ARCH" -DCMAKE_OSX_SYSROOT="$SDKROOT" \
            -DENABLE_SWITCH2KIT=ON -DENABLE_QT=ON -DENABLE_SDL=ON \
            -DUSE_SYSTEM_SDL3=OFF \
            -DCMAKE_PREFIX_PATH="$S2K_QT_PREFIX" \
            -DQt6_DIR="$S2K_QT_PREFIX/lib/cmake/Qt6" \
            -DENABLE_VULKAN=OFF -DENABLE_TESTS=OFF -DPOSTPROCESS_BUNDLE=ON \
            2>&1 | tee switch2kit-configure.log
          jobs="$(sysctl -n hw.logicalcpu)"
          if [ "$GITHUB_EVENT_NAME" != workflow_dispatch ]; then jobs=$((jobs + 2)); fi
          cmake --build build-switch2kit --target dolphin-emu_autogen dolphin-emu --parallel "$jobs" \
            2>&1 | tee switch2kit-build.log
      - name: Compiler cache statistics
        if: always()
        run: sccache --show-stats
      - name: Inspect and archive application
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          app=build-switch2kit/Binaries/DolphinQt.app
          test -d "$app"
          test -f "$app/Contents/Frameworks/libSwitch2KitC.dylib"
          /usr/libexec/PlistBuddy -c 'Print :NSBluetoothAlwaysUsageDescription' "$app/Contents/Info.plist"
          lipo "$app/Contents/MacOS/DolphinQt" -verify_arch "$ARCH"
          lipo "$app/Contents/Frameworks/libSwitch2KitC.dylib" -verify_arch "$ARCH"
          test -f "$app/Contents/Resources/Sys/Profiles/GCPad/Switch2Kit GameCube.ini"
          test -f "$app/Contents/Resources/Sys/Profiles/GCPad/Switch2Kit Pro Controller 2.ini"
          ditto -c -k --keepParent "$app" "Dolphin-Switch2Kit-$ARCH.zip"
      - name: Launch, normally quit and relaunch the exact ZIP with build roots denied
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          python3 Tools/test_switch2kit_bundle.py "Dolphin-Switch2Kit-$ARCH.zip" \
            --architecture "$ARCH" --report switch2kit-validation.json
      - name: Application artifact (not hardware-qualified or notarized)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Dolphin-Switch2Kit-${{ matrix.arch }}
          path: |
            Dolphin-Switch2Kit-${{ matrix.arch }}.zip
            switch2kit-validation.json
          if-no-files-found: error
      - name: Build diagnostics
        if: failure() || cancelled() || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Switch2Kit-${{ matrix.arch }}-diagnostics
          path: |
            switch2kit-*.log
            switch2kit-*.sample
            switch2kit-validation.json
            switch2kit-configure-profile.json
            build-switch2kit/build.ninja
            build-switch2kit/compile_commands.json
            build-switch2kit/CMakeCache.txt
            build-switch2kit/CMakeFiles/CMakeConfigureLog.yaml
      # Keep valid compiler objects even when a later build/test is cancelled.
      # Never save build trees, applications, configuration answers or test results.
      - name: Save compiler objects after native validation
        if: always() && steps.compiler-cache.outcome == 'success'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ env.SCCACHE_DIR }}
          key: ${{ steps.compiler-objects.outputs.cache-primary-key }}
