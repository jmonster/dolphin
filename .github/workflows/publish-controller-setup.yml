name: Publish controller setup review branch
on:
  push:
    branches: [qa/publish-controller-setup]
    paths: [.github/workflows/publish-controller-setup.yml]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feature/switch2kit-easy-setup
      - name: Apply verified files and pin the companion motor library
        env:
          PAYLOAD: >-
            
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = cd2209c3adb8f387c1f6fc9258017765c5ad8ed9
          python3 - <<'PY'
          import base64, hashlib, json, os, zlib
          from pathlib import Path
          for edit in json.loads(zlib.decompress(base64.b64decode(os.environ['PAYLOAD'], validate=True))):
              path = Path(edit['path'])
              assert not path.is_absolute() and '..' not in path.parts
              original = path.read_text() if path.exists() else ''
              if edit['old'] is None:
                  assert not path.exists()
              else:
                  assert hashlib.sha256(original.encode()).hexdigest() == edit['old'], path
              lines = original.splitlines(keepends=True)
              for start, end, replacement in reversed(edit['ops']):
                  lines[start:end] = replacement.splitlines(keepends=True)
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(''.join(lines))
          PY
          git diff --check
          git add -A
          GIT_INDEX_FILE="$RUNNER_TEMP/verify-index" git read-tree --empty
          git ls-files --stage | awk '$1 != "160000"' | GIT_INDEX_FILE="$RUNNER_TEMP/verify-index" git update-index --index-info
          test "$(GIT_INDEX_FILE="$RUNNER_TEMP/verify-index" git write-tree)" = f77e02c495ce4c68d64152b23aae9d180995faf3
          git update-index --cacheinfo 160000,8088ce3ef6845fe90d8ff7a579e6498668bd65de,Externals/Switch2Kit
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Add per-port Switch 2 controller setup and recommended mappings with rumble' -m 'Choose GameCube/Pro controllers beside each port. Preserve custom mappings with confirmation and backups; never reset on hotplug. Include both presets, production mapping-helper regressions and the tested GameCube motor library. AI-assisted; physical rumble acceptance remains separate.'
          git push origin HEAD:refs/heads/feature/switch2kit-easy-setup
