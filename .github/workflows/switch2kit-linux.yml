name: Linux Switch2Kit host
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-22.04
    container: swift:6.2.1-jammy
    timeout-minutes: 50
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive
          persist-credentials: false
      - name: Install native dependencies
        run: |
          apt-get update
          apt-get install -y ninja-build cmake build-essential pkg-config python3 python3-dbusmock python3-dbus \
            dbus-x11 bluez libdbus-1-dev libgtk-3-dev libavcodec-dev libavformat-dev libavutil-dev \
            libswscale-dev libswresample-dev libx11-dev libxext-dev libxi-dev libxrandr-dev libudev-dev \
            libusb-1.0-0-dev libevdev-dev libmbedtls-dev libcurl4-openssl-dev liblzo2-dev libzstd-dev \
            libbz2-dev zlib1g-dev libpng-dev libgl1-mesa-dev mesa-utils xvfb openbox xdotool x11-utils wmctrl \
            qt6-base-dev qt6-base-private-dev qt6-svg-dev qt6-tools-dev patchelf
      - name: Build a backend-disabled native application without Swift
        run: |
          cmake -S . -B build-disabled -G Ninja -DCMAKE_BUILD_TYPE=Release -DENABLE_SWITCH2KIT=OFF \
            -DENABLE_TESTS=OFF -DENABLE_SWIFT=OFF -DUSE_DISCORD_PRESENCE=OFF \
            -DENABLE_AUTOUPDATE=OFF -DCMAKE_DISABLE_FIND_PACKAGE_Swift=TRUE 2>&1 | tee linux-disabled-configure.log
          cmake --build build-disabled --target dolphin-emu -j4 2>&1 | tee linux-disabled-build.log
          ldd build-disabled/Binaries/dolphin-emu | tee linux-disabled-dependencies.log
          ! grep -Ei 'Switch2Kit|libswift|libFoundation|libdispatch' linux-disabled-dependencies.log
          # Qt initializes even for --version. This disabled-backend smoke probe
          # is distinct from the enabled package's visible GUI/quit/relaunch gate.
          profile=$(mktemp -d)
          trap 'rm -rf "$profile"' EXIT
          HOME="$profile" XDG_CONFIG_HOME="$profile/config" XDG_CACHE_HOME="$profile/cache" \
            QT_QPA_PLATFORM=offscreen build-disabled/Binaries/dolphin-emu --user "$profile/user" --version
      - name: Build the complete controller-enabled application
        run: |
          Tools/build-switch2kit-linux.sh build-switch2kit-linux package-switch2kit-linux 2>&1 | tee linux-build.log
      - name: Inspect the installed dependency closure
        run: |
          test -x package-switch2kit-linux/bin/dolphin-emu
          test -f package-switch2kit-linux/lib/dolphin/libSwitch2KitC.so
          find package-switch2kit-linux -type f -o -type l | sort | tee linux-package-files.log
          ldd package-switch2kit-linux/bin/dolphin-emu | tee linux-dependencies.log
          ! grep -q 'not found' linux-dependencies.log
          readelf -d package-switch2kit-linux/bin/dolphin-emu | tee linux-rpath.log
          python3 Tools/test_switch2kit_retained.py
      - name: Package the controller-enabled application
        run: tar -czf dolphin-switch2kit-linux-x86_64.tar.gz package-switch2kit-linux
      - name: Verify extraction, relocation, normal shutdown and relaunch
        run: |
          Tools/test_switch2kit_linux_launch.sh dolphin-switch2kit-linux-x86_64.tar.gz 2>&1 | tee linux-launch.log
      - name: Upload controller-enabled application
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dolphin-switch2kit-linux-x86_64
          path: dolphin-switch2kit-linux-x86_64.tar.gz
          if-no-files-found: error
          retention-days: 14
      - name: Preserve native diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dolphin-linux-native-diagnostics
          path: |
            linux-*.log
            linux-launch.json
          if-no-files-found: warn
          retention-days: 7
