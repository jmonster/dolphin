# This is the only automatic workflow. Budgets are enforced by Tools/check_ci_policy.py.
name: Native Switch2Kit
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-switch2kit-${{ github.ref }}
  cancel-in-progress: true
jobs:
  wiring:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    env:
      PYTHONPATH: ${{ runner.temp }}/ci-policy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        timeout-minutes: 1
        with:
          persist-credentials: false
          fetch-depth: 1
          submodules: false
      - name: Enforce the CI cost policy before fetching dependencies
        timeout-minutes: 1
        run: |
          python3 -m pip install --disable-pip-version-check --no-deps --only-binary=:all: --retries 1 --timeout 10 --target "$RUNNER_TEMP/ci-policy" PyYAML==6.0.3
          python3 Tools/check_ci_policy.py
      - name: Fetch only the pinned SDK and SDL, without their history
        timeout-minutes: 1
        run: git submodule update --init --depth 1 Externals/Switch2Kit Externals/SDL/SDL
      - name: Run the fast regressions (60 seconds total, 20 seconds per command)
        timeout-minutes: 2
        run: python3 Tools/run_fast_tests.py
